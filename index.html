<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Wish</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e1b4b, #31103f); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-x: hidden; }
        .container { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 25px; border-radius: 20px; max-width: 450px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); position: relative; z-index: 2; }
        .input-group { margin-bottom: 12px; text-align: left; }
        label { font-size: 13px; color: #cbd5e1; margin-bottom: 4px; display: block; }
        input, textarea { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 14px; outline: none; }
        button, .video-btn { width: 100%; padding: 12px; background: linear-gradient(45deg, #ff007f, #7928ca); border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 10px; display: inline-block; text-decoration: none; box-shadow: 0 4px 15px rgba(255, 0, 127, 0.3); }
        #qrcode-container { margin-top: 15px; display: none; flex-direction: column; align-items: center; }
        #qrImage { background: white; padding: 10px; border-radius: 12px; width: 180px; height: 180px; margin-bottom: 10px; }
        .title { font-size: 1.8rem; color: #ff79c6; margin-bottom: 10px; }
        .name { font-size: 2rem; color: #50fa7b; font-weight: bold; margin-bottom: 15px; }
        .video-box { width: 100%; border-radius: 12px; overflow: hidden; margin-bottom: 15px; background: rgba(0, 0, 0, 0.4); border: 1px solid rgba(255, 255, 255, 0.1); }
        .video-box iframe { width: 100%; height: 220px; border: none; display: block; }
        .message-box { background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 12px; font-size: 0.95rem; line-height: 1.4; color: #f8f8f2; margin-bottom: 15px; text-align: left; border-left: 4px solid #ff79c6; }
        .balloon { position: absolute; width: 40px; height: 60px; background: rgba(255, 121, 198, 0.7); border-radius: 50%; animation: floatUp 8s linear infinite; bottom: -100px; z-index: 1; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-120vh); opacity: 0; } }
    </style>
</head>
<body>
    <div id="balloon-container"></div>
    <div class="container">
        <!-- FORM SECTION -->
        <div id="setup-section">
            <h2 style="margin-bottom: 15px; color: #ff79c6;">🎉 Birthday Video QR Generator</h2>
            <div class="input-group">
                <label>Naam:</label>
                <input type="text" id="nameInput" placeholder="Soni">
            </div>
            <div class="input-group">
                <label>Google Drive ya Video Link:</label>
                <input type="text" id="videoInput" placeholder="Drive ka link paste karein">
            </div>
            <div class="input-group">
                <label>Birthday Wish Message:</label>
                <textarea id="msgInput" rows="3" placeholder="Happy Birthday!"></textarea>
            </div>
            <button onclick="generateQR()">QR Code Banayein</button>

            <div id="qrcode-container">
                <h4 style="color: #50fa7b; margin-bottom: 8px;">Aapka QR Code Tayar Hai!</h4>
                <img id="qrImage" src="" alt="QR Code">
                <p style="font-size: 11px; color: #cbd5e1;">Is image ko download karke print nikalwa lein.</p>
            </div>
        </div>

        <!-- WISH & VIDEO SECTION -->
        <div id="wish-section" style="display: none;">
            <h1 class="title">🎂 HAPPY BIRTHDAY! 🎂</h1>
            <div class="name" id="displayName"></div>
            
            <div class="video-box" id="videoContainer"></div>

            <div class="message-box" id="displayMsg"></div>
            <button onclick="triggerConfetti()">🎉 Celebration Dubara Dekhein</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name');
            const video = urlParams.get('video');
            const msg = urlParams.get('msg');

            if (name && msg) {
                document.getElementById('setup-section').style.display = 'none';
                document.getElementById('wish-section').style.display = 'block';
                document.getElementById('displayName').innerText = decodeURIComponent(name);
                document.getElementById('displayMsg').innerText = decodeURIComponent(msg);

                let rawUrl = decodeURIComponent(video || '');
                let embedUrl = rawUrl;

                if (rawUrl.includes('drive.google.com') && rawUrl.includes('/view')) {
                    embedUrl = rawUrl.replace('/view', '/preview');
                } else if (rawUrl.includes('youtube.com/watch?v=')) {
                    embedUrl = rawUrl.replace('watch?v=', 'embed/');
                } else if (rawUrl.includes('youtu.be/')) {
                    embedUrl = rawUrl.replace('youtu.be/', 'www.youtube.com/embed/');
                }

                if (rawUrl) {
                    document.getElementById('videoContainer').innerHTML = `
                        <iframe src="${embedUrl}" allow="autoplay"></iframe>
                        <div style="padding: 10px; background: rgba(0,0,0,0.5);">
                            <a href="${rawUrl}" target="_blank" class="video-btn" style="margin-top: 0; font-size: 14px;">▶️ Video Fullscreen Play Karein</a>
                        </div>
                    `;
                } else {
                    document.getElementById('videoContainer').style.display = 'none';
                }

                triggerConfetti();
                createBalloons();
            }
        };

        function generateQR() {
            const name = document.getElementById('nameInput').value.trim();
            const video = document.getElementById('videoInput').value.trim();
            const msg = document.getElementById('msgInput').value.trim();

            if (!name || !msg) {
                alert("Naam aur Message dono bharein!");
                return;
            }

            const baseUrl = "https://akshitsingh734-source.github.io/-/";
            const wishUrl = `${baseUrl}?name=${encodeURIComponent(name)}&video=${encodeURIComponent(video)}&msg=${encodeURIComponent(msg)}`;
            
            const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=${encodeURIComponent(wishUrl)}`;
            
            document.getElementById('qrImage').src = qrApi;
            document.getElementById('qrcode-container').style.display = 'flex';
        }

        function triggerConfetti() {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        function createBalloons() {
            const container = document.getElementById('balloon-container');
            const colors = ['#ff79c6', '#8be9fd', '#50fa7b', '#ffb86c', '#bd93f9'];
            for (let i = 0; i < 12; i++) {
                let balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.left = Math.random() * 100 + 'vw';
                balloon.style.animationDelay = Math.random() * 4 + 's';
                balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                container.appendChild(balloon);
            }
        }
    </script>
</body>
</html>
