<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Wish & QR Generator</title>
    <!-- Canvas Confetti Library -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- QRCode.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e1b4b, #31103f);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.07);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            max-width: 500px;
            width: 100%;
            text-align: center;
            position: relative;
            z-index: 2;
        }

        /* --- Generator Styling --- */
        .input-group {
            margin-bottom: 15px;
            text-align: left;
        }

        label {
            font-size: 14px;
            color: #cbd5e1;
            margin-bottom: 5px;
            display: block;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.2);
            color: #fff;
            font-size: 15px;
            outline: none;
        }

        button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(45deg, #ff007f, #7928ca);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        button:hover {
            transform: scale(1.02);
            box-shadow: 0 5px 20px rgba(255, 0, 127, 0.4);
        }

        #qrcode-container {
            margin-top: 20px;
            display: none;
            flex-direction: column;
            align-items: center;
        }

        #qrcode {
            background: #fff;
            padding: 15px;
            border-radius: 15px;
            margin-bottom: 15px;
        }

        /* --- Wish Styling --- */
        .title {
            font-size: 2.2rem;
            color: #ff79c6;
            text-shadow: 0 0 10px rgba(255, 121, 198, 0.5);
            margin-bottom: 15px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.03); }
        }

        .name {
            font-size: 2.5rem;
            color: #50fa7b;
            font-weight: bold;
            text-shadow: 0 0 15px rgba(80, 250, 123, 0.6);
            margin-bottom: 15px;
        }

        .message-box {
            background: rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            font-size: 1.1rem;
            line-height: 1.6;
            color: #f8f8f2;
            margin-bottom: 20px;
            border-left: 4px solid #ff79c6;
        }

        .cake-emoji {
            font-size: 4rem;
            margin: 15px 0;
            animation: bounce 1.5s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-15px); }
        }

        /* --- Floating Balloons Animation --- */
        .balloon {
            position: absolute;
            width: 50px;
            height: 70px;
            background: rgba(255, 121, 198, 0.7);
            border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%;
            animation: floatUp 8s linear infinite;
            bottom: -100px;
            z-index: 1;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-120vh) rotate(20deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <!-- Balloon Animations Background -->
    <div id="balloon-container"></div>

    <div class="container">
        <!-- 1. Form to Generate QR Code -->
        <div id="setup-section">
            <h2 style="margin-bottom: 20px; color: #ff79c6;">🎉 Birthday QR Code Generator</h2>
            <div class="input-group">
                <label>Jiske liye gift hai unka naam:</label>
                <input type="text" id="nameInput" placeholder="Eg. Rahul">
            </div>
            <div class="input-group">
                <label>Birthday Wish Message:</label>
                <textarea id="msgInput" rows="4" placeholder="Aapke liye koi khas message..."></textarea>
            </div>
            <button onclick="generateQR()">QR Code Banayein</button>

            <div id="qrcode-container">
                <h4 style="color: #50fa7b; margin-bottom: 10px;">Aapka QR Code Taiyar Hai!</h4>
                <div id="qrcode"></div>
                <p style="font-size: 12px; color: #cbd5e1; margin-bottom: 10px;">Is QR Code par Right-Click karke save karein aur print nikal lein.</p>
                <button onclick="testWish()" style="background: #50fa7b; color: #000;">Wish Page Ka Preview Dekhein</button>
            </div>
        </div>

        <!-- 2. Final Wish View (Scan karne par ye dikhega) -->
        <div id="wish-section" style="display: none;">
            <div class="cake-emoji">🎂</div>
            <h1 class="title">HAPPY BIRTHDAY!</h1>
            <div class="name" id="displayName">Friend</div>
            <div class="message-box" id="displayMsg">
                Wishing you a day filled with love, laughter, and happiness!
            </div>
            <button onclick="triggerConfetti()">🎉 Celebration Dubara Dekhein</button>
        </div>
    </div>

    <script>
        // Check parameters in URL (Jab QR code scan hoga)
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name');
            const msg = urlParams.get('msg');

            if (name && msg) {
                // Hide Setup and Show Wish
                document.getElementById('setup-section').style.display = 'none';
                document.getElementById('wish-section').style.display = 'block';

                document.getElementById('displayName').innerText = decodeURIComponent(name);
                document.getElementById('displayMsg').innerText = decodeURIComponent(msg);

                // Start Animations
                triggerConfetti();
                createBalloons();
            }
        };

        // QR Code Generator Function
        function generateQR() {
            const name = document.getElementById('nameInput').value.trim();
            const msg = document.getElementById('msgInput').value.trim();

            if (!name || !msg) {
                alert("Kripya Naam aur Message dono bharein!");
                return;
            }

            // Current Page URL with parameters
            const currentUrl = window.location.href.split('?')[0];
            const wishUrl = `${currentUrl}?name=${encodeURIComponent(name)}&msg=${encodeURIComponent(msg)}`;

            // Clear previous QR
            document.getElementById('qrcode').innerHTML = "";

            // Generate New QR
            new QRCode(document.getElementById("qrcode"), {
                text: wishUrl,
                width: 180,
                height: 180,
                colorDark : "#000000",
                colorLight : "#ffffff",
                correctLevel : QRCode.CorrectLevel.H
            });

            document.getElementById('qrcode-container').style.display = 'flex';
        }

        // Preview Test
        function testWish() {
            const name = document.getElementById('nameInput').value.trim();
            const msg = document.getElementById('msgInput').value.trim();
            window.location.href = `?name=${encodeURIComponent(name)}&msg=${encodeURIComponent(msg)}`;
        }

        // Confetti Fireworks Animation
        function triggerConfetti() {
            var count = 200;
            var defaults = { origin: { y: 0.7 } };

            function fire(particleRatio, opts) {
                confetti(Object.assign({}, defaults, opts, {
                    particleCount: Math.floor(count * particleRatio)
                }));
            }

            fire(0.25, { spread: 26, startVelocity: 55, });
            fire(0.2, { spread: 60, });
            fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
            fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
            fire(0.1, { spread: 120, startVelocity: 45, });
        }

        // Balloon Creation Function
        function createBalloons() {
            const container = document.getElementById('balloon-container');
            const colors = ['#ff79c6', '#8be9fd', '#50fa7b', '#ffb86c', '#bd93f9'];
            
            for (let i = 0; i < 15; i++) {
                let balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.left = Math.random() * 100 + 'vw';
                balloon.style.animationDelay = Math.random() * 5 + 's';
                balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                container.appendChild(balloon);
            }
        }
    </script>
</body>
</html>
