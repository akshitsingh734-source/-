<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday Wish</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: linear-gradient(135deg, #0f172a, #1e1b4b, #31103f); color: #fff; min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 20px; overflow-x: hidden; }
        .container { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.2); padding: 25px; border-radius: 20px; max-width: 450px; width: 100%; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); z-index: 2; position: relative; }
        .input-group { margin-bottom: 15px; text-align: left; }
        label { font-size: 14px; color: #cbd5e1; margin-bottom: 5px; display: block; }
        input, textarea { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.2); background: rgba(0, 0, 0, 0.3); color: #fff; font-size: 15px; outline: none; }
        button { width: 100%; padding: 12px; background: linear-gradient(45deg, #ff007f, #7928ca); border: none; color: white; font-size: 16px; font-weight: bold; border-radius: 10px; cursor: pointer; margin-top: 10px; }
        #qrcode-container { margin-top: 20px; display: none; flex-direction: column; align-items: center; }
        #qrImage { background: white; padding: 10px; border-radius: 12px; width: 200px; height: 200px; margin-bottom: 15px; }
        .title { font-size: 2rem; color: #ff79c6; text-shadow: 0 0 10px rgba(255, 121, 198, 0.5); margin-bottom: 15px; }
        .name { font-size: 2.2rem; color: #50fa7b; font-weight: bold; margin-bottom: 15px; text-shadow: 0 0 10px rgba(80, 250, 123, 0.5); }
        .message-box { background: rgba(255, 255, 255, 0.1); padding: 18px; border-radius: 12px; font-size: 1rem; line-height: 1.5; color: #f8f8f2; margin-bottom: 20px; border-left: 4px solid #ff79c6; text-align: left; }
        .cake { font-size: 3.5rem; margin-bottom: 10px; animation: bounce 1.5s infinite alternate; }
        @keyframes bounce { from { transform: translateY(0); } to { transform: translateY(-12px); } }
        .balloon { position: absolute; width: 40px; height: 60px; background: rgba(255, 121, 198, 0.7); border-radius: 50% 50% 50% 50% / 40% 40% 60% 60%; animation: floatUp 8s linear infinite; bottom: -100px; z-index: 1; }
        @keyframes floatUp { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-120vh); opacity: 0; } }
    </style>
</head>
<body>
    <div id="balloon-container"></div>
    <div class="container">
        <!-- FORM SECTION -->
        <div id="setup-section">
            <h2 style="margin-bottom: 15px; color: #ff79c6;">🎉 Birthday QR Code</h2>
            <div class="input-group">
                <label>Naam:</label>
                <input type="text" id="nameInput" placeholder="Soni">
            </div>
            <div class="input-group">
                <label>Birthday Wish Message:</label>
                <textarea id="msgInput" rows="4" placeholder="Happy Birthday!"></textarea>
            </div>
            <button onclick="generateQR()">QR Code Banayein</button>

            <div id="qrcode-container">
                <h4 style="color: #50fa7b; margin-bottom: 10px;">Aapka QR Code Tayar Hai!</h4>
                <img id="qrImage" src="" alt="QR Code">
                <p style="font-size: 12px; color: #cbd5e1; margin-bottom: 10px;">Is QR Code par thodi der dabayein (Long Press) aur image download kar lein.</p>
            </div>
        </div>

        <!-- WISH SECTION -->
        <div id="wish-section" style="display: none;">
            <div class="cake">🎂</div>
            <h1 class="title">HAPPY BIRTHDAY!</h1>
            <div class="name" id="displayName"></div>
            <div class="message-box" id="displayMsg"></div>
            <button onclick="triggerConfetti()">🎉 Celebration Dubara Dekhein</button>
        </div>
    </div>

    <script>
        window.onload = function() {
            const urlParams = new URLSearchParams(window.location.search);
            const name = urlParams.get('name');
            const msg = urlParams.get('msg');

            if (name && msg) {
                document.getElementById('setup-section').style.display = 'none';
                document.getElementById('wish-section').style.display = 'block';
                document.getElementById('displayName').innerText = decodeURIComponent(name);
                document.getElementById('displayMsg').innerText = decodeURIComponent(msg);
                triggerConfetti();
                createBalloons();
            }
        };

        function generateQR() {
            const name = document.getElementById('nameInput').value.trim();
            const msg = document.getElementById('msgInput').value.trim();

            if (!name || !msg) {
                alert("Kripya Naam aur Message dono bharein!");
                return;
            }

            const currentUrl = window.location.href.split('?')[0];
            const wishUrl = `${currentUrl}?name=${encodeURIComponent(name)}&msg=${encodeURIComponent(msg)}`;
            
            // Fast reliable QR API
            const qrApi = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(wishUrl)}`;
            
            document.getElementById('qrImage').src = qrApi;
            document.getElementById('qrcode-container').style.display = 'flex';
        }

        function triggerConfetti() {
            confetti({ particleCount: 100, spread: 70, origin: { y: 0.6 } });
        }

        function createBalloons() {
            const container = document.getElementById('balloon-container');
            const colors = ['#ff79c6', '#8be9fd', '#50fa7b', '#ffb86c', '#bd93f9'];
            for (let i = 0; i < 12; i++) {
                let balloon = document.createElement('div');
                balloon.className = 'balloon';
                balloon.style.left = Math.random() * 100 + 'vw';
                balloon.style.animationDelay = Math.random() * 4 + 's';
                balloon.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                container.appendChild(balloon);
            }
        }
    </script>
</body>
</html>
